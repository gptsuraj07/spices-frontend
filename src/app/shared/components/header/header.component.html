<header class="header" [class.header--scrolled]="isScrolled" role="banner">
  <div class="header__container container">

    <!-- Logo -->
    <a routerLink="/" class="header__logo" aria-label="Aridhu - Home">
      <img src="assets/aridhu-logo.png" alt="Aridhu - Health Meets Tradition" class="header__logo-img" />
    </a>

    <!-- Desktop Nav -->
    <nav class="header__nav" role="navigation" aria-label="Main navigation">
      <ul class="header__nav-list">
        <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}" class="header__nav-link">Home</a></li>
        <li><a routerLink="/shop" routerLinkActive="active" class="header__nav-link">All Shop</a></li>
        <li><a routerLink="/category/kozhambu" routerLinkActive="active" class="header__nav-link">Kuzhambu</a></li>
        <li><a routerLink="/category/rasam" routerLinkActive="active" class="header__nav-link">Rasam</a></li>
        <li><a routerLink="/category/sambar" routerLinkActive="active" class="header__nav-link">Sambar</a></li>
        <li><a routerLink="/category/tiffin-mixes" routerLinkActive="active" class="header__nav-link">Tiffin Mixes</a></li>
        <li><a routerLink="/category/combos" routerLinkActive="active" class="header__nav-link">Combos</a></li>
        <li><a routerLink="/track-order" routerLinkActive="active" class="header__nav-link header__nav-link--track" id="track-order-nav">Track Order →</a></li>
      </ul>
    </nav>

    <!-- Actions -->
    <div class="header__actions">
      <!-- Search button -->
      <button class="header__action-btn" type="button" (click)="toggleSearch()" [attr.aria-expanded]="searchOpen" aria-label="Search">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
      </button>

      <!-- Cart -->
      <a routerLink="/cart" class="header__cart-btn" aria-label="Cart ({{ cartCount }} items)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="9" cy="21" r="1" />
          <circle cx="20" cy="21" r="1" />
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
        </svg>
        <span class="header__cart-badge" *ngIf="cartCount > 0" aria-hidden="true">{{ cartCount }}</span>
      </a>

      <!-- Mobile menu toggle -->
      <button class="header__menu-btn" type="button" (click)="toggleMobileMenu()" [attr.aria-expanded]="mobileMenuOpen" aria-label="Menu">
        <span class="header__hamburger" [class.open]="mobileMenuOpen">
          <span></span><span></span><span></span>
        </span>
      </button>
    </div>
  </div>

  <!-- Search Bar -->
  <div class="header__search-bar" [class.header__search-bar--open]="searchOpen" role="search">
    <div class="container">
      <form class="header__search-form" (submit)="onSearch($event)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input type="search" class="header__search-input" [(ngModel)]="searchQuery" name="searchQuery"
          placeholder="Search for rasam, kozhambu, sambar, podi..." aria-label="Search products" autocomplete="off"
          [autofocus]="searchOpen" />
        <button type="submit" class="btn btn-primary btn-sm">Search</button>
        <button type="button" class="header__search-close" (click)="closeSearch()" aria-label="Close search">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </form>
    </div>
  </div>

  <!-- Mobile Nav Drawer -->
  <div class="header__mobile-nav" [class.header__mobile-nav--open]="mobileMenuOpen" role="navigation" aria-label="Mobile navigation">
    <nav>
      <ul class="header__mobile-list">
        <li>
          <a routerLink="/" (click)="closeMobileMenu()" class="header__mobile-link">
            <span>Home</span>
          </a>
        </li>
        <li>
          <a routerLink="/shop" (click)="closeMobileMenu()" class="header__mobile-link">
            <span>All Products</span>
          </a>
        </li>
        <li>
          <a routerLink="/category/kozhambu" (click)="closeMobileMenu()" class="header__mobile-link">
            <span>Kuzhambu Powders</span>
          </a>
        </li>
        <li>
          <a routerLink="/category/rasam" (click)="closeMobileMenu()" class="header__mobile-link">
            <span>Rasam Powders</span>
          </a>
        </li>
        <li>
          <a routerLink="/category/sambar" (click)="closeMobileMenu()" class="header__mobile-link">
            <span>Sambar Powders</span>
          </a>
        </li>
        <li>
          <a routerLink="/category/tiffin-mixes" (click)="closeMobileMenu()" class="header__mobile-link">
            <span>Tiffin Mixes &amp; Podis</span>
          </a>
        </li>
        <li>
          <a routerLink="/category/combos" (click)="closeMobileMenu()" class="header__mobile-link">
            <span>Signature Combos</span>
          </a>
        </li>
        <li>
          <a routerLink="/track-order" (click)="closeMobileMenu()" class="header__mobile-link header__mobile-link--track" id="track-order-mobile-nav">
            <span>Track Order</span>
          </a>
        </li>
      </ul>
    </nav>
  </div>

  <!-- Overlay -->
  <div class="header__overlay" *ngIf="mobileMenuOpen" (click)="closeMobileMenu()" aria-hidden="true"></div>
</header>
