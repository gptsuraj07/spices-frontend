<div class="admin-shell" [class.admin-shell--collapsed]="!sidebarOpen">

  <!-- Mobile Backdrop -->
  <div class="admin-sidebar-backdrop" *ngIf="sidebarOpen" (click)="toggleSidebar()"></div>

  <!-- Sidebar -->
  <aside class="admin-sidebar" [class.admin-sidebar--open]="sidebarOpen">
    <!-- Logo -->
    <div class="admin-sidebar__logo">
      <img src="assets/aridhu-logo.png" alt="Aridhu Admin" style="height: 36px; width: auto; object-fit: contain;" />
      <span class="admin-sidebar__badge" *ngIf="sidebarOpen" style="margin-left: 0.5rem;">Admin</span>
    </div>

    <!-- Nav -->
    <nav class="admin-sidebar__nav" aria-label="Admin navigation">
      <ul class="admin-sidebar__nav-list">
        <li *ngFor="let item of navItems">
          <a
            [routerLink]="item.route"
            routerLinkActive="active"
            class="admin-sidebar__nav-link"
            (click)="onNavClick()"
            [attr.title]="!sidebarOpen ? item.label : null"
          >
            <!-- Icons -->
            <ng-container [ngSwitch]="item.icon">
              <svg *ngSwitchCase="'grid'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
              </svg>
              <svg *ngSwitchCase="'package'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/>
                <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
                <polyline points="3.27,6.96 12,12.01 20.73,6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>
              </svg>
              <svg *ngSwitchCase="'tag'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>
              </svg>
              <svg *ngSwitchCase="'layers'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <polygon points="12,2 2,7 12,12 22,7 12,2"/><polyline points="2,17 12,22 22,17"/><polyline points="2,12 12,17 22,12"/>
              </svg>
              <svg *ngSwitchCase="'shopping-bag'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/>
                <path d="M16 10a4 4 0 0 1-8 0"/>
              </svg>
              <svg *ngSwitchCase="'settings'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                <circle cx="12" cy="12" r="3"/>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
              </svg>
            </ng-container>
            <span class="admin-sidebar__nav-label" *ngIf="sidebarOpen">{{ item.label }}</span>
            <span class="admin-sidebar__nav-badge" *ngIf="item.badge && sidebarOpen">{{ item.badge }}</span>
          </a>
        </li>
      </ul>
    </nav>

    <!-- Bottom actions -->
    <div class="admin-sidebar__footer">
      <button class="admin-sidebar__nav-link" type="button" (click)="goToStore()" [attr.title]="!sidebarOpen ? 'View Store' : null">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/>
        </svg>
        <span class="admin-sidebar__nav-label" *ngIf="sidebarOpen">View Store</span>
      </button>
      <button class="admin-sidebar__nav-link admin-sidebar__nav-link--logout" type="button" (click)="logout()" [attr.title]="!sidebarOpen ? 'Logout' : null">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16,17 21,12 16,7"/><line x1="21" y1="12" x2="9" y2="12"/>
        </svg>
        <span class="admin-sidebar__nav-label" *ngIf="sidebarOpen">Logout</span>
      </button>
    </div>
  </aside>

  <!-- Main content -->
  <div class="admin-main">
    <!-- Top bar -->
    <header class="admin-topbar">
      <button class="admin-topbar__toggle" type="button" (click)="toggleSidebar()" aria-label="Toggle sidebar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
      <div class="admin-topbar__breadcrumb">
        <span class="admin-topbar__page-title">Aridhu Admin</span>
      </div>
      <div class="admin-topbar__actions">
        <a routerLink="/" target="_blank" class="admin-topbar__store-link" title="View Store">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
          Store
        </a>
        <div class="admin-topbar__avatar" title="Admin — admin@aridhu.com">
          A
        </div>
      </div>
    </header>

    <!-- Page content -->
    <main class="admin-content">
      <router-outlet></router-outlet>
    </main>

    <!-- Mobile Bottom Navigation Bar (< 768px) -->
    <nav class="admin-bottom-nav" aria-label="Mobile bottom navigation">
      <a routerLink="/admin/dashboard" routerLinkActive="active" class="admin-bottom-nav__item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
        </svg>
        <span>Dashboard</span>
      </a>
      <a routerLink="/admin/products" routerLinkActive="active" class="admin-bottom-nav__item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/>
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
          <polyline points="3.27,6.96 12,12.01 20.73,6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>
        </svg>
        <span>Products</span>
      </a>
      <a routerLink="/admin/orders" routerLinkActive="active" class="admin-bottom-nav__item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
        <span>Orders</span>
      </a>
      <a routerLink="/admin/categories" routerLinkActive="active" class="admin-bottom-nav__item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/>
        </svg>
        <span>Categories</span>
      </a>
      <a routerLink="/admin/combos" routerLinkActive="active" class="admin-bottom-nav__item">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <polygon points="12,2 2,7 12,12 22,7 12,2"/><polyline points="2,17 12,22 22,17"/><polyline points="2,12 12,17 22,12"/>
        </svg>
        <span>Combos</span>
      </a>
    </nav>
  </div>

  <app-toast-container></app-toast-container>
</div>
